<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة حل الواجبات الذكية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        select, button { padding: 12px 20px; font-size: 16px; margin: 10px; border-radius: 8px; border: none; cursor: pointer; }
        select { background: #333; color: #fff; }
        button { background: #00bcd4; color: #000; font-weight: bold; }
        video { width: 100%; max-width: 400px; border-radius: 10px; border: 2px solid #444; margin-top: 10px; }
        #result { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: left; direction: ltr; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>🤖 نظام حل الأسئلة الذكي</h2>

    <div>
        <label>اختر المادة:</label><br>
        <select id="subjectSelect">
            <option value="إنجليزي">1. إنجليزي</option>
            <option value="فيزياء">2. فيزياء</option>
            <option value="تاريخ">3. تاريخ</option>
        </select>
    </div>

    <div>
        <video id="video" autoplay playsinline></video><br>
        <button onclick="captureAndSend()">📸 تصوير وإرسال للسيرفر</button>
    </div>

    <h3 id="status"></h3>
    <div id="result">النتائج ستظهر هنا...</div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("تعذر فتح الكاميرا: " + err); });

        async function captureAndSend() {
            const subject = document.getElementById('subjectSelect').value;
            const status = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            
            status.innerText = "جاري التقاط الصورة وتحليلها...";
            resultDiv.innerText = "";

            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageBase64 = canvas.toDataURL('image/jpeg').split(',')[1];

            try {
                const response = await fetch('https://ai-homework-server.onrender.com/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64, subject })
                });

                const data = await response.json();
                if (data.success) {
                    status.innerText = `تم الحل بنجاح عبر (${data.modelUsed}) 🎉`;
                    resultDiv.innerText = data.answers;
                } else {
                    status.innerText = "حدث خطأ أثناء التحليل.";
                }
            } catch (error) {
                status.innerText = "فشل الاتصال بالسيرفر.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
